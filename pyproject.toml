[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jot-notes"
version = "0.3.1"
description = "A tiny command-line notes tool (workshop sample project)"
readme = "JOT.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[project.scripts]
jot = "jot.cli:main"

[tool.setuptools]
packages = ["jot"]
